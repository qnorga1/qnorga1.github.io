    long: 'Dummy Seminar Series on Image Analysis'
    url: 'https://example.com'
    eds: [[2026, 'https://example.com/2026'], [2025, 'https://example.com/2025']]

ae:
  - id: 'DICMI'
    years: [2026]

steering:
