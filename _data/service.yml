    years: [2026, 2025]

sub:
  - id: 'Dummy Conference'
    years: [2024]

grant:
  - id: 'Dummy Research Foundation'
    years: [2026]

other:
  - text: 'Dummy PhD student representative'
    url: 'https://example.com'
    years: [2025, 2026]
