# Publications, rendered by _includes/fmt-pub.html on the /publications/ page.
#
# Entries are grouped by `year` (newest year first); within a year they are
# shown in the order listed here, so keep the newest paper at the top.
#
# All available fields (only id, title, author, venue and year are required; leave out the rest).
#
# Basic information:
#
#   id:        (required) unique key, used as HTML anchor (#id) and for local files in /files/
#              e.g. "ches25-foo"
#   title:     (required) paper title; links to the PDF when `pdf` is set
#   author:    (required) list of authors; the site author's name (author.name in _config.yml) is shown in bold
#              e.g. ['Alice Example', 'Quinten Norga']
#   venue:     (required) full venue name, shown in italics
#   year:      (required) publication year; entries are grouped by it, e.g. 2025
#   month:     publication month, shown before the year, e.g. "June"
#   acro:      venue acronym, shown in parentheses after the venue, e.g. "CHES"
#   type:      label shown before the title: "conference", "journal", "preprint" or "report"
#              (each has its own color; any other text is shown as-is with a neutral color)
#   short:     short name, used in "Prior work" / "Follow-up work" links and logo alt text
#              (defaults to the title / id), e.g. "FooAttack"
#
# Detail line (small gray line under the venue, in this order):
#
#   award:     award text, with a gold star, e.g. "Best Paper Award"
#   outreach:  list of [label, url] pairs, with a bullhorn icon, e.g. [['University news', 'https://...']]
#   presented: list of [label, url, presenter], with a presentation icon, shown as "Also presented at: ...":
#              workshops without proceedings where the work was (also) presented. Entries are separated by ";".
#              url and presenter are optional; leave presenter out when you presented it yourself, and
#              use '' for the url when there is none but there is a presenter, e.g.
#              [['Workshop A, 2025', 'https://...'], ['Workshop B, 2025', '', 'Alice Example']]
#              e.g. [['Workshop A 2025', 'https://...'], ['Workshop B 2025']]
#   cve:       CVE / disclosure text, with a bug icon, e.g. "CVE-2025-12345"
#   links:     list of [label, url] pairs, with an info icon, e.g. [['Dataset', 'https://...']]
#   badge:     text with a certificate icon, e.g. artifact evaluation badges "Artifacts Available, Functional"
#   media:     list of [label, url] pairs, shown as "Media: ..." (press coverage)
#
# Buttons, in this order. File buttons take a URL, or `true` to use a local file in /files/:
#
#   pdf:       "PDF"       true -> files/<id>.pdf
#   doi:       "DOI"       DOI, e.g. "10.1000/xyz123" (links to https://doi.org/...), or a full URL
#   website:   "Website"   URL
#   wiki:      "Wikipedia" URL
#   slides:    "Slides"    true -> files/<id>-slides.pdf
#   poster:    "Poster"    true -> files/<id>-poster.pdf
#                          or another id, e.g. "uasc26" -> files/uasc26-poster.pdf (poster shown at another venue)
#                          or a URL
#   recording: "Talk"      URL of a talk recording
#   demo:      "Demo"      URL
#   github:    "GitHub"    URL
#   arxiv:     "Extended version (arXiv)"  URL
#   eprint:    "IACR ePrint" (IACR logo)  ePrint id, e.g. "2025/123" (links to https://eprint.iacr.org/2025/123),
#              or a full URL
#   logo:      "Logo"      panel with logo and download links:
#                          true -> files/<id>-logo.svg and files/<id>-logo.png
#                          or another id to reuse that paper's logo, e.g. "ches24-foo" -> files/ches24-foo-logo.svg
#   logo-alt:  (with logo) second logo in the same panel, same rules: files/<id>-logo-alt.svg / .png
#   bibtex:    "BibTeX"    full BibTeX entry as a multi-line block (`bibtex: |`), shown with a copy button
#
# TL;DR panel ("TL;DR" button, shown when any of these is set):
#
#   tldr:      one-paragraph summary (with the logo next to it, if `logo` is set)
#   topic:     space-separated topics, listed in the panel and used for the "Filter by topic" dropdown
#              e.g. "side-channels post-quantum"
#   prev:      space-separated ids of prior work, listed as "Prior work"; the "Follow-up work" list
#              of those papers is derived automatically, e.g. "ches24-foo tches23-bar"
#
# Example:
#
#  - id: "miccai25-example"
#    short: "Example"
#    title: "An Example Paper Title"
#    author: ['First Author', 'Quinten Norga', 'Last Author']
#    venue: "International Conference on Medical Image Computing and Computer-Assisted Intervention"
#    acro: "MICCAI"
#    type: "conference"
#    month: "October"
#    year: 2025
#    topic: "segmentation deep-learning"
#    prev: "isbi24-earlier-work"
#    pdf: true
#    github: "https://github.com/user/repo"
#    arxiv: "https://arxiv.org/abs/0000.00000"
#    links: [['Dataset', 'https://example.com/data']]
#    presented: [['Example Workshop 2025', 'https://example.com/workshop', 'Alice Example'], ['Other Workshop 2025']]
#    tldr: |
#      One-sentence summary of the contribution.
#    bibtex: |
#      @inproceedings{author2025example,
#        title     = {An Example Paper Title},
#        author    = {Author, First and Norga, Quinten and Author, Last},
#        booktitle = {MICCAI},
#        year      = {2025}
#      }

