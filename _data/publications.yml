# Publications, rendered by _includes/fmt-pub.html on the /publications/ page.
#
# Entries are grouped by `year` (newest year first); within a year they are
# shown in the order listed here, so keep the newest paper at the top.
#
# Fields (only id, title, author, venue and year are required):
#
#   id:        unique key, used as HTML anchor and for local files, e.g. "miccai25-foo"
#   short:     short name, shown in "Prior work" / "Follow-up work" links
#   title:     paper title
#   author:    list of authors; the site author's name (author.name in _config.yml) is shown in bold
#   venue:     full venue name
#   acro:      venue acronym, shown in parentheses after the venue
#   type:      label shown before the title: conference, journal, preprint or report
#              (any other text is shown as-is with a neutral color)
#   month:     publication month (optional)
#   year:      publication year
#   topic:     space-separated topics; populates the "Filter by topic" dropdown
#   prev:      space-separated ids of prior work; follow-up work is derived automatically
#   tldr:      one-paragraph summary, shown in the TL;DR panel
#   award:     award text (gold star)
#   badge:     e.g. artifact evaluation badges
#   cve:       CVE / disclosure text
#   links:     list of [label, url] pairs (info icon)
#   outreach:  list of [label, url] pairs (bullhorn icon)
#   media:     list of [label, url] pairs (press coverage)
#   bibtex:    full BibTeX entry as a multi-line block (shown in the BibTeX panel, with a copy button)
#
# Buttons (set to a URL, or to `true` to use the local file in /files/):
#
#   pdf:       true -> files/<id>.pdf
#   slides:    true -> files/<id>-slides.pdf
#   poster:    true -> files/<id>-poster.pdf
#   logo:      true -> files/<id>-logo.svg and files/<id>-logo.png (or a file prefix instead of true)
#   logo-alt:  true -> files/<id>-logo-alt.svg and files/<id>-logo-alt.png
#   website, wiki, recording, demo, github, arxiv: URLs
#
# Example:
#
#  - id: "miccai25-example"
#    short: "Example"
#    title: "An Example Paper Title"
#    author: ['First Author', 'Quinten Norga', 'Last Author']
#    venue: "International Conference on Medical Image Computing and Computer-Assisted Intervention"
#    acro: "MICCAI"
#    type: "conference"
#    month: "October"
#    year: 2025
#    topic: "segmentation deep-learning"
#    prev: "isbi24-earlier-work"
#    pdf: true
#    github: "https://github.com/user/repo"
#    arxiv: "https://arxiv.org/abs/0000.00000"
#    links: [['Dataset', 'https://example.com/data']]
#    tldr: |
#      One-sentence summary of the contribution.
#    bibtex: |
#      @inproceedings{author2025example,
#        title     = {An Example Paper Title},
#        author    = {Author, First and Norga, Quinten and Author, Last},
#        booktitle = {MICCAI},
#        year      = {2025}
#      }

pubs:
  # DUMMY entries for previewing the layout -- replace or delete them.

  # Uses (almost) every field.
  - id: "dummy26-full"
    short: "DummyFull"
    title: "Dummy Paper Showing Every Available Field"
    author: ['Alice Example', 'Quinten Norga', 'Bob Example']
    venue: "Dummy International Conference on Medical Imaging"
    acro: "DICMI"
    type: "conference"
    month: "June"
    year: 2026
    topic: "segmentation deep-learning uncertainty"
    prev: "dummy25-medium"
    pdf: "https://example.com/dummy-paper.pdf"
    website: "https://example.com"
    wiki: "https://en.wikipedia.org/wiki/Image_segmentation"
    slides: "https://example.com/dummy-slides.pdf"
    poster: "https://example.com/dummy-poster.pdf"
    recording: "https://example.com/dummy-recording"
    demo: "https://example.com/dummy-demo"
    github: "https://github.com/example/dummy"
    arxiv: "https://arxiv.org/abs/0000.00000"
    award: "Best Paper Award (dummy)"
    badge: "Artifacts evaluated: Available, Functional (dummy)"
    cve: "Dummy disclosure text"
    links: [['Dataset', 'https://example.com/data'], ['Project page', 'https://example.com/project']]
    outreach: [['University news', 'https://example.com/news']]
    media: [['Dummy Times', 'https://example.com/times'], ['Example Weekly', 'https://example.com/weekly']]
    tldr: |
      A dummy one-paragraph summary of the contribution, shown in the TL;DR panel together with the topics and prior/follow-up work.
    bibtex: |
      @inproceedings{example2026dummy,
        title     = {Dummy Paper Showing Every Available Field},
        author    = {Example, Alice and Norga, Quinten and Example, Bob},
        booktitle = {Dummy International Conference on Medical Imaging ({DICMI})},
        year      = {2026}
      }

  # A typical entry.
  - id: "dummy25-medium"
    short: "DummyMedium"
    title: "Dummy Journal Article with a Typical Set of Fields"
    author: ['Quinten Norga', 'Carol Example']
    venue: "Dummy Journal of Medical Image Analysis"
    type: "journal"
    year: 2025
    topic: "segmentation"
    pdf: "https://example.com/dummy-article.pdf"
    github: "https://github.com/example/dummy"
    tldr: |
      Prior work of the paper above; its "Follow-up work" link is generated automatically.
    bibtex: |
      @article{norga2025dummy,
        title   = {Dummy Journal Article with a Typical Set of Fields},
        author  = {Norga, Quinten and Example, Carol},
        journal = {Dummy Journal of Medical Image Analysis},
        year    = {2025}
      }

  # Only the required fields.
  - id: "dummy24-minimal"
    title: "Dummy Preprint with Only the Required Fields"
    author: ['Quinten Norga']
    venue: "arXiv preprint"
    type: "preprint"
    year: 2024

  # A technical report.
  - id: "dummy24-report"
    title: "Dummy Technical Report"
    author: ['Quinten Norga', 'Dave Example']
    venue: "Dummy University Technical Report"
    type: "report"
    year: 2024
